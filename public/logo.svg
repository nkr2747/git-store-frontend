<svg width="2200" height="1400" viewBox="0 0 2200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>

    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Huge Infinity Symbol -->
  <path
    d="M 450 700
       C 450 380, 850 380, 1100 700
       C 1350 1020, 1750 1020, 1750 700
       C 1750 380, 1350 380, 1100 700
       C 850 1020, 450 1020, 450 700"
    fill="none"
    stroke="url(#mainGradient)"
    stroke-width="95"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neonGlow)"
  />

  <!-- Inner Highlight -->
  <path
    d="M 520 700
       C 520 460, 860 460, 1100 700
       C 1340 940, 1680 940, 1680 700
       C 1680 460, 1340 460, 1100 700
       C 860 940, 520 940, 520 700"
    fill="none"
    stroke="#e9d5ff"
    stroke-opacity="0.45"
    stroke-width="18"
    stroke-linecap="round"
    filter="url(#neonGlow)"
  />

  <!-- Ambient Glow Circles -->
  <circle cx="730" cy="700" r="140" fill="#7c3aed" opacity="0.08"/>
  <circle cx="1470" cy="700" r="140" fill="#38bdf8" opacity="0.08"/>
</svg>
