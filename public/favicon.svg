<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Black background box (w-8 equivalent) -->
  <rect width="32" height="32" fill="#000000" />
  
  <!-- Centered white square rotated 45 degrees (w-3 equivalent) -->
  <!-- Rotated around the exact center of the canvas (16, 16) -->
  <rect x="10" y="10" width="12" height="12" fill="#ffffff" transform="rotate(45 16 16)" />
</svg>
